name: Release

# Semantic-release pipeline. On every push to main:
#   1. `release` runs python-semantic-release: it reads the Conventional Commit
#      messages since the last v* tag, decides the next SemVer, stamps it into
#      pyproject.toml / PKGBUILD / .SRCINFO, regenerates CHANGELOG.md, commits,
#      tags v{version}, and creates the GitHub Release. If no commit warrants a
#      release, it does nothing and the build jobs are skipped.
#   2. `linux-build` / `windows-build` run ONLY when a release was cut. They
#      check out the freshly created tag, build the Arch package and the
#      Windows installer, and upload them as assets on that release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege by default; jobs opt up to write where they need it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + all tags so PSR can find the last release and parse
          # every commit since it.
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  linux-build:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .pkg.tar.zst asset to the release
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tooling
        # base-devel already provides makepkg/sudo/fakeroot; add what the
        # PKGBUILD's build() needs (uv, rsync), git for checkout, github-cli
        # to upload the asset, and the system-site deps the package links
        # against at build time.
        run: |
          pacman -Syu --noconfirm --needed \
            git uv rsync python python-gobject gstreamer gst-plugin-pipewire github-cli

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Build package
        # makepkg refuses to run as root, so build as an unprivileged user.
        # --nodeps: skip installing runtime deps (kdotool is AUR-only and
        # isn't needed to *build* the package, only to run it).
        run: |
          useradd -m builder
          # git 2.35+ refuses "dubious ownership" of a dir owned by another user
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -c '
            set -euo pipefail
            cd "'"$GITHUB_WORKSPACE"'/packaging/arch"
            makepkg -f --nodeps --noconfirm
          '

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=$(ls "$GITHUB_WORKSPACE"/packaging/arch/*.pkg.tar.zst | head -1)
          gh release upload "${{ needs.release.outputs.tag }}" "$f" --clobber

  windows-build:
    needs: release
    if: needs.release.outputs.released == 'true'
    # Native Windows runner — a Windows .exe CANNOT be cross-compiled from
    # Linux, so PyInstaller must run here.
    runs-on: windows-latest
    permissions:
      contents: write # upload the installer asset to the release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps + add PyInstaller
        # PyInstaller is a build-only tool, deliberately not a pyproject
        # dependency — install it into the synced venv here.
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build onedir bundle
        # --distpath/--workpath pin the output to packaging\windows\dist so it
        # matches the `Source: "dist\argus\*"` path in argus.iss (Inno resolves
        # that relative to the .iss file's directory).
        run: >
          uv run pyinstaller packaging\windows\argus.spec
          --noconfirm
          --distpath packaging\windows\dist
          --workpath packaging\windows\build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        # Inject the release version so OutputBaseFilename and the installer's
        # AppVersion match the git tag (see the #ifndef guard in argus.iss).
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ needs.release.outputs.version }}
          packaging\windows\argus.iss

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $f = Get-ChildItem packaging\windows\Output\argus-setup-*.exe | Select-Object -First 1
          gh release upload "${{ needs.release.outputs.tag }}" $f.FullName --clobber
