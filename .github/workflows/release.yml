name: Build & Release (Arch package + Windows installer)

# Build the CachyOS/Arch package AND the Windows installer on every push to
# main and publish both to a GitHub Release (.pkg.tar.zst + argus-setup.exe).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write  # needed to create releases + tags

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tooling
        # base-devel already provides makepkg/sudo/fakeroot; add what the
        # PKGBUILD's build() needs (uv, rsync) plus git for checkout and the
        # venv/system-site deps the package links against at build time.
        run: |
          pacman -Syu --noconfirm --needed \
            git uv rsync python python-gobject gstreamer gst-plugin-pipewire

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        # makepkg refuses to run as root, so build as an unprivileged user.
        # --nodeps: skip installing runtime deps (kdotool is AUR-only and
        # isn't needed to *build* the package, only to run it).
        run: |
          useradd -m builder
          # git 2.35+ refuses "dubious ownership" of a dir owned by another user
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -c '
            set -euo pipefail
            cd "'"$GITHUB_WORKSPACE"'/packaging/arch"
            makepkg -f --nodeps --noconfirm
          '

      - name: Locate artifact
        id: pkg
        run: |
          f=$(ls "$GITHUB_WORKSPACE"/packaging/arch/*.pkg.tar.zst | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          # pkgver from the PKGBUILD, for the release title.
          ver=$(sudo -u builder bash -c 'cd "'"$GITHUB_WORKSPACE"'/packaging/arch"; source PKGBUILD; echo "$pkgver-$pkgrel"')
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Unique tag per build so successive main commits don't collide on
          # the same pkgver. Marked as the latest release.
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: Argus ${{ steps.pkg.outputs.ver }} (build ${{ github.run_number }})
          body: |
            Automated build from commit ${{ github.sha }}.

            Install on CachyOS/Arch:
            ```
            sudo pacman -U ${{ steps.pkg.outputs.name }}
            ```
            Runtime deps (installed by pacman from the package's `depends`,
            except `kdotool` which comes from the AUR — `paru -S kdotool`).

            Windows: download `argus-setup-*.exe` below and run it (per-user
            install, no admin needed; registers Argus to start at logon).
          files: ${{ steps.pkg.outputs.path }}
          make_latest: true

  build-windows:
    # Native Windows runner — a Windows .exe CANNOT be cross-compiled from
    # Linux, so PyInstaller must run here. Runs independently of the Arch
    # job and attaches its installer to the same release tag.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps + add PyInstaller
        # PyInstaller is a build-only tool, deliberately not a pyproject
        # dependency — install it into the synced venv here.
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build onedir bundle
        # --distpath/--workpath pin the output to packaging\windows\dist so
        # it matches the `Source: "dist\argus\*"` path in argus.iss (Inno
        # resolves that relative to the .iss file's directory). Without this,
        # PyInstaller would write dist\ to the repo root and ISCC would fail
        # to find the bundle.
        run: >
          uv run pyinstaller packaging\windows\argus.spec
          --noconfirm
          --distpath packaging\windows\dist
          --workpath packaging\windows\build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          packaging\windows\argus.iss

      - name: Locate installer
        id: win
        shell: pwsh
        run: |
          $f = Get-ChildItem packaging\windows\Output\argus-setup-*.exe | Select-Object -First 1
          echo "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          files: ${{ steps.win.outputs.path }}
          make_latest: true
