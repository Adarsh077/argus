[project]
name = "argus"
version = "0.3.0"
description = "Argus — cross-platform desktop activity tracker (Phase 1: daemon skeleton + config + database)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3 ; sys_platform == 'linux'",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "mss>=10.2.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pygobject>=3.56.3 ; sys_platform == 'linux'",
    "pystray>=0.19.5",
    "python-multipart>=0.0.32",
    "pywin32>=306 ; sys_platform == 'win32'",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/argus"]

# ---------------------------------------------------------------------------
# Release automation (python-semantic-release v10).
#
# Versioning is driven entirely by Conventional Commit messages on `main`:
#   fix:      -> patch  (0.1.0 -> 0.1.1)
#   feat:     -> minor  (0.1.0 -> 0.2.0)
#   feat!: / "BREAKING CHANGE:" footer -> major, but see allow_zero_version.
# Types like ci/docs/chore/refactor/test do NOT trigger a release on their own.
# PSR stamps the new version into every file listed below, regenerates
# CHANGELOG.md, commits, tags v{version}, and cuts the GitHub Release. The
# distributable artifacts (Arch package, Windows installer) are built and
# attached in separate CI jobs — see .github/workflows/release.yml.
# ---------------------------------------------------------------------------
[tool.semantic_release]
tag_format = "v{version}"
# Keep 0.x semantics: a breaking change bumps the minor (0.1 -> 0.2), not to
# 1.0.0. Flip this to false (and land a `feat!:`) when we're ready to cut 1.0.
allow_zero_version = true
commit_parser = "conventional"
# No build here: artifacts are produced by the linux-build / windows-build CI
# jobs against the tag PSR creates, not during the version step.
build_command = ""
# The single source of truth for the package version.
version_toml = ["pyproject.toml:project.version"]
# Downstream packaging files that embed the same version and must move in
# lockstep. argus.iss is handled differently (CI passes /DMyAppVersion) because
# its `#define` syntax isn't a plain `name = value` assignment.
version_variables = [
    "packaging/arch/PKGBUILD:pkgver",
    "packaging/arch/.SRCINFO:pkgver",
    # AUR-published PKGBUILD (packaging/aur/) — its checksum + .SRCINFO are
    # regenerated in CI (publish-aur job), but pkgver is stamped here in
    # lockstep with the rest.
    "packaging/aur/PKGBUILD:pkgver",
]

[tool.semantic_release.branches.main]
match = "main"
