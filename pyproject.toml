[project]
name = "argus"
version = "0.1.0"
description = "Argus — cross-platform desktop activity tracker (Phase 1: daemon skeleton + config + database)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3 ; sys_platform == 'linux'",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "mss>=10.2.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pygobject>=3.56.3 ; sys_platform == 'linux'",
    "pystray>=0.19.5",
    "python-multipart>=0.0.32",
    "pywin32>=306 ; sys_platform == 'win32'",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/argus"]
